<style>
/* ========== 全局重置 ========== */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;overflow:hidden;font-family:'Segoe UI','PingFang SC',sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}

/* ========== 准星 ========== */
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
#crosshair .h,#crosshair .v{position:absolute;background:rgba(0,255,100,.9);box-shadow:0 0 3px rgba(0,255,100,.5)}
#crosshair .h{width:2px;height:14px;left:-1px;top:-7px}
#crosshair .v{width:14px;height:2px;left:-7px;top:-1px}
#crosshair .dot{position:absolute;width:2px;height:2px;background:#0f0;left:-1px;top:-1px;border-radius:50%;opacity:.7}

/* ========== 命中标记 ========== */
#hitmark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;color:#ef4444;font-weight:bold;opacity:0;transition:opacity .08s;text-shadow:0 0 10px rgba(239,68,68,.9)}
#hitmark.show{opacity:1}

#dmgind .arc{position:absolute;width:60px;height:60px;border:3px solid rgba(255,40,40,.8);border-radius:50%;clip-path:polygon(50% 50%,100% 0,100% 100%);opacity:0;transition:opacity .15s}

/* ========== 底部 HUD ========== */
#hud{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(8,8,16,.92),rgba(4,4,10,.96));color:#e0e0e0;padding:10px 24px;border-radius:8px;font-size:13px;display:flex;gap:24px;align-items:center;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);box-shadow:0 -2px 20px rgba(0,0,0,.5)}

#hud .hp{color:#4ade80;font-weight:600}#hud .armor{color:#60a5fa;font-weight:600}#hud .ammo{color:#fde047;font-weight:600}#hud .money{color:#22d3ee;font-weight:600}#hud .score{color:#c084fc;font-weight:600}
#hud .low{color:#ef4444;animation:hp-blink .5s infinite}
@keyframes hp-blink{50%{opacity:.35}}

/* ========== 顶部信息 ========== */
#info{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#ddd;font-size:13px;text-align:center;background:rgba(8,8,18,.85);padding:5px 18px;border-radius:6px;border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(6px)}

#endoverlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;pointer-events:auto;backdrop-filter:blur(8px)}

/* ========== 计分板 ========== */
#scoreboard{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(180deg,rgba(6,6,18,.97),rgba(3,3,10,.98));border:2px solid rgba(255,255,255,.1);color:#ddd;padding:22px;font-size:13px;display:none;flex-direction:column;gap:6px;min-width:420px;pointer-events:auto;z-index:25;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.6);backdrop-filter:blur(10px)}
#scoreboard h3{text-align:center;font-size:17px;margin-bottom:8px;letter-spacing:1px}

/* ========== 屏幕红晕 (受伤/闪光) ========== */

/* ========== 小地图 ========== */

/* ========== 武器栏 ========== */
#weapons{position:absolute;bottom:110px;right:18px;display:flex;flex-direction:column;gap:5px}
#weapons .wslot{background:rgba(8,8,18,.75);color:#555;padding:5px 12px;border-radius:5px;font-size:12px;border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(4px);transition:all .15s}
#weapons .wslot.active{color:#f0f0f0;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06)}

/* ========== 脚步声指示器(调试用,不用可隐藏) ========== */
#stepind{position:absolute;bottom:140px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.3);pointer-events:none;opacity:0;transition:opacity .2s}
</style>

<script type="module">
import * as THREE from 'three';

// ==================================================================
// 模块 1: 常量定义
// ==================================================================
const MAP_W = 140, MAP_H = 100, WALL_H = 7, TILE = 4;
const BOMB_TIME = 40, DEFUSE_NORM = 10, DEFUSE_KIT = 5;
const MONEY_START = 800, KILL_R = 300, HS_BONUS = 100, PLANT_R = 300, DEFUSE_R = 300;
const WIN_R = 3250, LOSE_BASE = 1400;
const PLAYER_R = 0.35, BOT_R = 0.4, GRAVITY = 18, BUY_ZONE = 14;
// 脚步声间隔(秒): 跑动 / 静步 / 蹲伏
const STEP_NORMAL = 0.38, STEP_WALK = 0.65, STEP_CROUCH = 1.15;
const SMOKE_RADIUS = 6, SMOKE_DURATION = 15, SMOKE_PARTICLES = 40;

// ==================================================================
// 模块 2: Web Audio 音频引擎
// ==================================================================
let AC; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}

/** 短促正弦/方波音效: frequency, duration(秒), volume(0-1), type */
function beep(f, d, v, t) {
  if (!AC) return; t = t || AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
}

/** 白噪声音效: duration(秒), volume(0-1), decay speed */
function noise(d, v, s) {
  if (!AC) return;
  const t = AC.currentTime, b = AC.createBufferSource();
  const buf = AC.createBuffer(1, AC.sampleRate * d, AC.sampleRate), c = buf.getChannelData(0);
  for (let i = 0; i < c.length; i++) c[i] = (Math.random() * 2 - 1) * Math.exp(-i / (s || 200));
  b.buffer = buf; const g = AC.createGain();
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  b.connect(g); g.connect(AC.destination); b.start(t);
}

/** 便捷音频: frequency, duration, volume */
function snd(f, d, v) { beep(f, d, v); }

/** 武器射击音效 */
function shotSnd(weapon) {
  const t = AC.currentTime;
  if (weapon === 'sniper') { noise(0.18, 0.45, 100); beep(120, 0.1, 0.3, t); beep(60, 0.15, 0.25, t); }
  else if (weapon === 'rifle') { noise(0.15, 0.4, 140); beep(160, 0.08, 0.25, t); }
  else if (weapon === 'deagle') { noise(0.2, 0.5, 120); beep(200, 0.12, 0.35, t); }
  else if (weapon === 'smg') { noise(0.1, 0.3, 200); beep(180, 0.06, 0.2, t); }
  else { noise(0.08, 0.25, 300); }
}

// ==================================================================
// 模块 3: 脚步声系统 — 独立于其他模块，仅依赖 player/bots 状态
// ==================================================================
/**
 * 播放脚步声。根据实体移动状态选择音高和音量。
 * @param {Object} entity  — 含 moving, crouch, walk, ground 属性
 */
function playFootstep(entity) {
  if (!entity.ground || !entity.moving) return;
  let freq = 80, vol = 0.06;
  if (entity.crouch) { freq = 45; vol = 0.03; }
  else if (entity.walk) { freq = 60; vol = 0.04; }
  beep(freq + Math.random() * 15, 0.06, vol);
}

/** 播放落地声(跳跃后) */
function playLand(entity) {
  beep(35, 0.08, 0.07);
}

/** 获取当前移动状态对应的脚步间隔 */
function getStepInterval(entity) {
  if (!entity.moving || !entity.ground) return Infinity;
  if (entity.crouch) return STEP_CROUCH;
  if (entity.walk) return STEP_WALK;
  return STEP_NORMAL;
}

// ==================================================================
// 模块 4: 烟雾弹视觉系统 — 独立于投掷逻辑
// ==================================================================
const smokes = []; // { x, z, y, radius, maxRadius, life, maxLife, meshes: THREE.Mesh[] }

/**
 * 在指定位置生成烟雾效果。
 * 创建若干个半透明球体，随时间膨胀并衰减。
 */
function spawnSmoke(x, z, y, radius, duration) {
  const particles = [];
  for (let i = 0; i < SMOKE_PARTICLES; i++) {
    const r = radius * (0.6 + Math.random() * 0.6);
    const geom = new THREE.SphereGeometry(r, 8, 6);
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(0.5 + Math.random() * 0.3, 0.5 + Math.random() * 0.3, 0.5 + Math.random() * 0.3),
      transparent: true, opacity: 0.35 + Math.random() * 0.15, depthWrite: false
    });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(x + (Math.random() - 0.5) * 2, y + Math.random() * 2, z + (Math.random() - 0.5) * 2);
    scene.add(mesh);
    particles.push({ mesh, mat, r, grow: 0, speed: 0.3 + Math.random() * 0.5 });
  }
  smokes.push({ x, z, y, radius, maxRadius: radius * 1.8, life: duration, maxLife: duration, particles });
}

/** 逐帧更新烟雾粒子：膨胀 + 衰减 */
function updateSmokes(dt) {
  for (let i = smokes.length - 1; i >= 0; i--) {
    const sm = smokes[i];
    sm.life -= dt;
    const lifeRatio = sm.life / sm.maxLife;
    for (const p of sm.particles) {
      p.grow += p.speed * dt;
      const scale = 1 + p.grow * 0.3;
      p.mesh.scale.setScalar(Math.min(scale, 2.5));
      // 初期膨胀->透明度增加，后期衰减->透明度降低
      const opacity = lifeRatio > 0.7 ? (1 - lifeRatio) / 0.3 * 0.4 : lifeRatio / 0.7 * 0.4;
      p.mat.opacity = Math.max(0, opacity);
    }
    if (sm.life <= 0) {
      for (const p of sm.particles) { scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mat.dispose(); }
      smokes.splice(i, 1);
    }
  }
}

/**
 * 检查两点连线是否穿过任何烟雾区域。
 * 用于 Bot 视线遮蔽：如果烟雾在中途，Bot 看不到目标。
 */
function isSmokeBetween(x1, z1, x2, z2) {
  for (const sm of smokes) {
    if (sm.life <= 0) continue;
    // 计算点到线段的最短距离
    const dx = x2 - x1, dz = z2 - z1;
    const lenSq = dx * dx + dz * dz;
    if (lenSq < 0.01) continue;
    let t = ((sm.x - x1) * dx + (sm.z - z1) * dz) / lenSq;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cz = z1 + t * dz;
    const dist = Math.hypot(sm.x - cx, sm.z - cz);
    if (dist < sm.maxRadius * 0.8) return true;
  }
  return false;
}

// ==================================================================
// 模块 4b: 命中火花 & 弹孔系统
// ==================================================================
const hitSparks = [];
const bulletHoles = [];

function spawnHitSparks(x, y, z) {
  for (let i = 0; i < 4 + Math.floor(Math.random() * 4); i++) {
    const geom = new THREE.SphereGeometry(0.03 + Math.random() * 0.04, 3, 2);
    const mat = new THREE.MeshBasicMaterial({ color: '#ffcc44', transparent: true, opacity: 1, depthWrite: false });
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(x, y, z);
    scene.add(mesh);
    const ang = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 3;
    hitSparks.push({
      x, y, z, mesh, mat,
      vx: Math.cos(ang) * spd * 0.6,
      vy: 1.5 + Math.random() * 3.5,
      vz: Math.sin(ang) * spd * 0.6,
      life: 0.25 + Math.random() * 0.35, maxLife: 0.6
    });
  }
}

function spawnBulletHole(x, y, z, nx, nz) {
  const geom = new THREE.CircleGeometry(0.05 + Math.random() * 0.04, 6);
  const mat = new THREE.MeshBasicMaterial({ color: '#1a1a1a', side: THREE.DoubleSide, transparent: true, opacity: 0.7, depthWrite: false });
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(x + nx * 0.03, y, z + nz * 0.03);
  mesh.rotation.x = -Math.PI / 2;
  scene.add(mesh);
  bulletHoles.push({ mesh, mat, life: 6 + Math.random() * 3 });
}

function updateHitSparks(dt) {
  for (let i = hitSparks.length - 1; i >= 0; i--) {
    const s = hitSparks[i]; s.life -= dt; s.vy -= GRAVITY * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    s.mesh.position.set(s.x, s.y, s.z);
    s.mat.opacity = Math.max(0, s.life / s.maxLife);
    s.mesh.scale.setScalar(0.25 + 0.75 * (s.life / s.maxLife));
    if (s.life <= 0) { scene.remove(s.mesh); s.mesh.geometry.dispose(); s.mat.dispose(); hitSparks.splice(i, 1); }
  }
}

function updateBulletHoles(dt) {
  for (let i = bulletHoles.length - 1; i >= 0; i--) {
    const h = bulletHoles[i]; h.life -= dt;

}

// 程序化纹理生成
function genTex(w,h,c1,c2) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = c1; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) {
    ctx.fillStyle = c2; ctx.globalAlpha = 0.15 + Math.random() * 0.35;
    ctx.fillRect(Math.floor(Math.random() * w), Math.floor(Math.random() * h), 2 + Math.random() * 6, 2 + Math.random() * 6);
  }
  ctx.globalAlpha = 1;
  // 砖缝线
  if (w > 64) {
    ctx.strokeStyle = c2; ctx.globalAlpha = 0.25; ctx.lineWidth = 1;
    for (let y = h / 4; y < h; y += h / 4) { ctx.beginPath(); ctx.moveTo(0, y + (Math.random() - 0.5) * 4); ctx.lineTo(w, y + (Math.random() - 0.5) * 4); ctx.stroke(); }
    for (let x = 0; x < w; x += w / 4) { ctx.beginPath(); ctx.moveTo(x + (Math.random() - 0.5) * 4, 0); ctx.lineTo(x + (Math.random() - 0.5) * 4, h); ctx.stroke(); }
  }
  const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(4, 4);
  tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter;
  return tex;
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

/** 圆形碰撞检测：实体(x,z)半径r是否与地图碰撞 */
function collides(x, z, r) {
  for (const w of walls) { const cx = clamp(x, w.x, w.x + w.w), cz = clamp(z, w.z, w.z + w.h); if (Math.hypot(x - cx, z - cz) < r) return true; }
  for (const c of crates) { const cx = clamp(x, c.x, c.x + c.w), cz = clamp(z, c.z, c.z + c.h); if (Math.hypot(x - cx, z - cz) < r) return true; }
  for (const w of thinWalls) { const cx = clamp(x, w.x, w.x + w.w), cz = clamp(z, w.z, w.z + w.h); if (Math.hypot(x - cx, z - cz) < r) return true; }
  return false;
}

/**
 * 射线检测：从 (ox,oy,oz) 沿方向 (dx,dy,dz) 检测 maxDist 距离。
 * @param penetrate 剩余穿透层数
 * @returns {dist, hit, world?, bot?, player?, pos:{x,z}, head?}
 */
function rayCast(ox, oy, oz, dx, dy, dz, mx, self, penetrate) {
  let dist = mx, best = null, p = penetrate || 0;
  const allObjs = [
    ...walls.map(w => ({ ...w, isWall: true })),
    ...thinWalls.map(w => ({ ...w, isThin: true })),
    ...crates.map(c => ({ ...c, isCrate: true }))
  ];
  for (const w of allObjs) {
    const t1 = (w.x - ox) / dx, t2 = (w.x + w.w - ox) / dx, tx1 = Math.min(t1, t2), tx2 = Math.max(t1, t2);
    const t3 = (w.z - oz) / dz, t4 = (w.z + w.h - oz) / dz, tz1 = Math.min(t3, t4), tz2 = Math.max(t3, t4);
    const mn = Math.max(tx1, tz1, 0.005), mx_ = Math.min(tx2, tz2);
    if (mn <= mx_ && mn < dist) {
      const canPen = w.isCrate || w.isThin || w.penetrate;
      if (p > 0 && canPen) { p--; continue; }
      dist = mn; best = { dist: mn, hit: true, world: true, pos: { x: ox + dx * dist, z: oz + dz * dist } };
    }
  }
  // Bot 命中检测
  for (const b of bots) {
    if (b.dead || b === self) continue;
    const d = rayCircle(ox, oz, dx, dz, b.x, b.z, BOT_R);
    if (d > 0 && d < (best ? best.dist : dist)) {
      const hitY = oy + dy * d;
      best = { dist: d, hit: true, bot: b, pos: { x: ox + dx * d, z: oz + dz * d }, head: (hitY - (b.y + 1.3)) > 0.05 };
    }
  }
  // 玩家检测(当射击者是Bot时)
  if (self && self !== player) {
    const d = rayCircle(ox, oz, dx, dz, player.x, player.z, PLAYER_R);
    if (d > 0 && d < (best ? best.dist : dist)) {
      const hitY = oy + dy * d;
      best = { dist: d, hit: true, player: true, pos: { x: ox + dx * d, z: oz + dz * d }, head: (hitY - player.y) > 0.3 };
    }
  }
  return best || { dist: mx, hit: false };
}

/** 射线与圆的交点距离 */
function rayCircle(ox, oz, dx, dz, sx, sz, r) {
  const fx = ox - sx, fz = oz - sz;
  const a = dx * dx + dz * dz, b = 2 * (fx * dx + fz * dz), c = fx * fx + fz * fz - r * r;
  let disc = b * b - 4 * a * c; if (disc < 0) return -1;
  disc = Math.sqrt(disc);
  const t1 = (-b - disc) / (2 * a), t2 = (-b + disc) / (2 * a);
  if (t1 > 0.005) return t1; if (t2 > 0.005) return t2; return -1;
}

/** 投掷手雷：根据玩家当前拥有的投掷物类型优先投掷 */
function throwNade(type) {
  if (!player.nades[type] || player.nades[type] <= 0) return;
  player.nades[type]--;
  const vx = Math.sin(player.face) * 12, vz = Math.cos(player.face) * 12, vy = 6 + player.pitch * 4;

    type, life: 1.5, timer: type === 'flash' ? 2 : type === 'smoke' ? 2.5 : 3, fuse: false
  });
  snd(400, 0.15, 0.15);
  updateHUD();
}

/** 更新所有飞行中的投掷物 */
function updateGrenades(dt) {
  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i];
    g.life -= dt;
    g.vy -= GRAVITY * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.z += g.vz * dt;
    if (g.y <= 0.05) { g.y = 0.05; g.vx *= 0.3; g.vz *= 0.3; g.vy *= -0.3; if (Math.abs(g.vy) < 0.5) g.vy = 0; }
    if (g.timer > 0) { g.timer -= dt; if (g.timer <= 0) detonateNade(g, i); }
    if (g.life <= 0) grenades.splice(i, 1);
  }
}

/** 手雷引爆 */
function detonateNade(g, idx) {
  if (g.type === 'he') {
    // 高爆手雷：爆炸光源 + 冲击波 + 碎片 + 范围伤害
    const ep = new THREE.PointLight('#ff6600', 20, 12);
    ep.position.set(g.x, 1, g.z); scene.add(ep);
    setTimeout(() => scene.remove(ep), 200);
    // 冲击波环
    const ringGeo = new THREE.RingGeometry(0.3, 1.2, 24);
    const ringMat = new THREE.MeshBasicMaterial({ color: '#ff9944', side: THREE.DoubleSide, transparent: true, opacity: 0.6, depthWrite: false });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.set(g.x, 0.2, g.z); ring.rotation.x = -Math.PI / 2; scene.add(ring);
    let ringLife = 0.5;
    const expandRing = () => {
      ringLife -= 0.016;
      if (ringLife <= 0) { scene.remove(ring); ringGeo.dispose(); ringMat.dispose(); return; }
      ring.scale.setScalar(1 + (1 - ringLife / 0.5) * 10);
      ringMat.opacity = ringLife / 0.5 * 0.6;
      requestAnimationFrame(expandRing);
    };
    expandRing();
    // 爆炸碎片
    for (let i = 0; i < 25; i++) {
      const sg = new THREE.SphereGeometry(0.04 + Math.random() * 0.08, 3, 2);
      const sm = new THREE.MeshBasicMaterial({ color: Math.random() > 0.4 ? '#ff6633' : '#ff9933', transparent: true, opacity: 1, depthWrite: false });
      const smesh = new THREE.Mesh(sg, sm);
      smesh.position.set(g.x + (Math.random() - 0.5) * 0.3, 0.4 + Math.random() * 0.6, g.z + (Math.random() - 0.5) * 0.3);
      scene.add(smesh);
      const ang = Math.random() * Math.PI * 2;
      hitSparks.push({ x: g.x, y: 0.4, z: g.z, mesh: smesh, mat: sm, vx: Math.cos(ang) * 6 * Math.random(), vy: 2 + Math.random() * 7, vz: Math.sin(ang) * 6 * Math.random(), life: 0.4 + Math.random() * 0.6, maxLife: 1.0 });
    }
    // 震屏
    const dp2 = Math.hypot(player.x - g.x, player.z - g.z);
    if (dp2 < 15) shakeMag = Math.max(shakeMag, (1 - dp2 / 15) * 2.5);
    noise(0.25, 0.5, 80); snd(30, 0.3, 0.6);
    const dp = Math.hypot(player.x - g.x, player.z - g.z);
    if (dp < 8) { const dmg = Math.round(60 * (1 - dp / 8)); damagePlayer(dmg, true); }
    for (const b of bots) {
      if (b.dead) continue;
      const d = Math.hypot(b.x - g.x, b.z - g.z);
      if (d < 8) { const dmg = Math.round(60 * (1 - d / 8)); damageBot(b, dmg, true); }
    }
  } else if (g.type === 'flash') {
    // 闪光弹：强光 + 屏幕白屏效果
    const ep = new THREE.PointLight('#ffffff', 30, 15);
    ep.position.set(g.x, 1.5, g.z); scene.add(ep);
    setTimeout(() => scene.remove(ep), 150);
    snd(2000, 0.2, 0.4); snd(3000, 0.15, 0.3);
    const dp = Math.hypot(player.x - g.x, player.z - g.z);
    if (dp < 10) {
      const dot = Math.cos(Math.atan2(g.x - player.x, g.z - player.z) - player.face);
      if (dot > 0) player.flashBlind = Math.min(3, 2 + dot * (1 - dp / 10) * 2);
    }
    for (const b of bots) {
      if (b.dead) continue;
      const d = Math.hypot(b.x - g.x, b.z - g.z);
      if (d < 10) {
        const dot = Math.cos(Math.atan2(g.x - b.x, g.z - b.z) - b.face);
        if (dot > 0) b.flashBlind = Math.min(3, 2 + dot * (1 - d / 10) * 2);
      }
    }
  } else if (g.type === 'smoke') {
    // 烟雾弹：生成烟雾云
    snd(30, 0.5, 0.4);
    spawnSmoke(g.x, g.z, 0.5, SMOKE_RADIUS, SMOKE_DURATION);
  }
  grenades.splice(idx, 1);
}

/** 玩家/Bot 开火 */
function fireWeapon(shooter, isBot) {
  const w = WEAPONS[shooter.weapon];
  if (!w || shooter.fireCd > 0 || shooter.reloadT > 0 || shooter.plantT > 0 || shooter.defuseT > 0) return;
  if (w.melee) return meleeAttack(shooter, isBot);
  if (!shooter.ammo[shooter.weapon] || shooter.ammo[shooter.weapon] <= 0) return;

  shooter.ammo[shooter.weapon]--;
  shooter.fireCd = w.fireRate;
  const idx = shooter.recIdx++;
  const ry = w.recoilY[Math.min(idx, w.recoilY.length - 1)] || w.recoilY[w.recoilY.length - 1];
  const rh = w.recoilH[Math.min(idx, w.recoilH.length - 1)] || 0;

  // 扩散计算
  let spread = w.spreadB;
  if (!isBot) {
    if (player.moving) spread *= w.moveP;
    if (!player.ground) spread *= 3.5;
    if (player.aim && w.scope) spread *= 0.1;
    if (player.crouch) spread *= 0.7;
  }

  const ang = shooter.face + rh + (Math.random() - 0.5) * spread * 2;
  const pit = shooter.pitch + ry + (Math.random() - 0.5) * spread * 2;
  const dx = Math.sin(ang) * Math.cos(pit), dy = Math.sin(pit), dz = Math.cos(ang) * Math.cos(pit);
  const mxDist = w.scope ? 180 : 120;

  const hit = rayCast(shooter.x, shooter.y + 0.3, shooter.z, dx, dy, dz, mxDist, isBot ? shooter : null, w.penetrate || 0);

  if (hit.hit) {
    const dMul = 1 - Math.min(0.7, hit.dist / mxDist);
    let dmg = Math.round(w.dmg * dMul);
    if (hit.head) dmg = Math.round(dmg * 4);

    if (hit.bot && !isBot) {
      if (damageBot(hit.bot, dmg)) { if (hit.head) { player.money += HS_BONUS; showHitmark(true); } }
      else showHitmark(false);
    } else if (hit.player && isBot) {
      damagePlayer(dmg);
    }
    // 命中特效：火花 + 弹孔
    if (hit.world || hit.bot || hit.player) {
      const hy = shooter.y + 0.3;
      spawnHitSparks(hit.pos.x, hy, hit.pos.z);
      if (hit.world) spawnBulletHole(hit.pos.x, hy, hit.pos.z, dx, dz);
    }
  }

  if (!isBot) {
    player.wpnKick = 0.06;
    muzzleFlash.intensity = 3;
    muzzleGlowMat.opacity = 0.7 + Math.random() * 0.3;
    muzzleFlashLife = 0.08;
    setTimeout(() => { muzzleFlash.intensity = 0; }, 60);
  }
  shotSnd(shooter.weapon);
  if (!isBot) updateHUD();
}

/** 近战攻击 */
function meleeAttack(shooter, isBot) {
  shooter.fireCd = WEAPONS.knife.fireRate;
  const dx = Math.sin(shooter.face), dz = Math.cos(shooter.face);
  if (!isBot) {
    for (const b of bots) {
      if (b.dead) continue;
      const d = Math.hypot(b.x - shooter.x, b.z - shooter.z);
      if (d < WEAPONS.knife.range) {
        const dot = (b.x - shooter.x) / d * dx + (b.z - shooter.z) / d * dz;
        if (dot > 0.7) { damageBot(b, 50 + Math.random() * 20); if (b.dead) showHitmark(true); else showHitmark(false); }
      }
    }
    player.wpnKick = 0.04;
  }
  snd(200, 0.08, 0.1);
}

/** 开始换弹 */
function reloadStart() {
  const w = WEAPONS[player.weapon];
  if (player.ammo[player.weapon] >= w.mag || player.reserve <= 0) return;
  player.reloadT = w.reloadT;
  snd(300, 0.25, 0.08);
}

/** 换弹完成 */
function reloadFinish() {
  const w = WEAPONS[player.weapon];
  const need = w.mag - (player.ammo[player.weapon] || 0), fr = Math.min(need, player.reserve);
  player.ammo[player.weapon] = (player.ammo[player.weapon] || 0) + fr;
  player.reserve -= fr;
  snd(500, 0.15, 0.1);
}

// 模块 15: 伤害与击杀
// ==================================================================
function damagePlayer(dmg, noArmor) {
  if (!noArmor && player.armor > 0) { const ad = Math.round(dmg * 0.5); player.armor = Math.max(0, player.armor - ad); player.hp -= dmg - ad; }
  else player.hp -= dmg;
  showDmgDir();
  if (player.hp <= 0) { player.hp = 0; killPlayer(); }
  updateHUD();
}

function damageBot(bot, dmg, noArmor) {
  if (!noArmor && bot.armor > 0) { const ad = Math.round(dmg * 0.5); bot.armor = Math.max(0, bot.armor - ad); bot.hp -= dmg - ad; }
  else bot.hp -= dmg;
  bot.lastAttacker = 'player'; if (bot.hp <= 0) { bot.hp = 0; killBot(bot); return true; }
  return false;
}

function killPlayer() {
  player.hp = 0; player.dead = true; player.deaths++;
  player.deathTilt = 0; player.deathFall = 0;
  addKillFeed('敌人', '你', false);
  if (player.bomb) { dropBomb(player.x, player.z); }
  if (player === planting) planting = null;
  if (player === defusing) defusing = null;
  if (curWpnModel) curWpnModel.visible = false;
}

function killBot(bot) {
  bot.dead = true; bot.deaths++;
  bot.deathTilt = 0; bot.deathFall = 0;
  // 仅玩家击杀给奖励，Bot之间互杀不计
  if (bot.lastAttacker === 'player') {
    player.kills++; player.money += KILL_R;
  } else {
    // Bot击杀Bot也记分
    for (const b of bots) { if (b !== bot && b.name === bot.lastAttacker) { b.kills++; break; } }
  }
  addKillFeed(bot.lastAttacker || '某人', bot.name, false);
  if (bot === planting) { planting = null; bot.bomb = true; }
  if (bot === defusing) defusing = null;
  if (bot.bomb) dropBomb(bot.x, bot.z);
  bot.lastAttacker = null;
  // 半透明化角色模型
  if (bot.meshGroup) {
    bot.meshGroup.children.forEach(c => {
      if (c.material) { c.material.transparent = true; c.material.opacity = 0.4; c.material.depthWrite = false; }
    });
  }
}

function dropBomb(x, z) { bombPos = { x, z }; }

function addKillFeed(k, v, hs) {
  const wn = WEAPONS[player.weapon] ? WEAPONS[player.weapon].name : '未知';
  deathFeed.push({ txt: k + ' [' + wn + '] ' + v, hs });

}

  ).join('');
}

// 模块 16: Bot AI (双方共用，根据 team 决定巡逻路线和 C4 行为)
// ==================================================================
const PATROLS_T = [{ x: -30, z: 20 }, { x: 30, z: 15 }, { x: 0, z: -5 }];
const PATROLS_CT = [{ x: -30, z: -20 }, { x: 30, z: -15 }, { x: 0, z: 5 }];

function updateBots(dt) {
  for (const bot of bots) {
    if (bot.dead) continue;
    // 闪光致盲
    if (bot.flashBlind > 0) { bot.flashBlind -= dt; continue; }
    bot.fireCd -= dt; bot.engageTime -= dt;

    // ---- 目标选择：优先看玩家，其次看敌方Bot ----
    const closestEnemy = findClosestEnemy(bot);
    const target = closestEnemy;
    const distTarget = target ? Math.hypot(bot.x - target.x, bot.z - target.z) : Infinity;
    const tAngle = target ? Math.atan2(target.x - bot.x, target.z - bot.z) : 0;
    const aDiff = target ? Math.abs(((tAngle - bot.face) + Math.PI * 3) % (Math.PI * 2) - Math.PI) : Math.PI;

    // 烟雾遮蔽检测
    let blocked = false;
    if (target) {
      blocked = rayBlocked(bot, target.x, target.z) || isSmokeBetween(bot.x, bot.z, target.x, target.z);
    }
    const canSee = target && !target.dead && distTarget < 45 && aDiff < 0.8 && !blocked;

    // ---- 交战状态 ----
    if (canSee) {
      bot.face += ((tAngle - bot.face) + Math.PI * 3) % (Math.PI * 2) - Math.PI > 0.5 ? 0.5 : -0.5;
      bot.face = ((bot.face % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      bot.engageTime = 3;
      bot.lastSeen = { x: target.x, z: target.z, time: 0 };
      if (bot.fireCd <= 0 && distTarget < 40) botShoot(bot, target.x, target.y + 1.3, target.z, distTarget);
      if (distTarget > 6) { bot.x += Math.sin(bot.face) * 3.2 * dt; bot.z += Math.cos(bot.face) * 3.2 * dt; }
      if (distTarget < 4) { bot.x -= Math.sin(bot.face) * 2 * dt; bot.z -= Math.cos(bot.face) * 2 * dt; }
    } else if (bot.engageTime > 0 || (bot.lastSeen && bot.lastSeen.time < 4)) {
      if (bot.lastSeen) bot.lastSeen.time += dt;
      const tx = bot.lastSeen ? bot.lastSeen.x : (target ? target.x : bot.x);
      const tz = bot.lastSeen ? bot.lastSeen.z : (target ? target.z : bot.z);
      bot.face = Math.atan2(tx - bot.x, tz - bot.z);
      bot.x += Math.sin(bot.face) * 2.6 * dt; bot.z += Math.cos(bot.face) * 2.6 * dt;
    } else {
      // ---- 巡逻 / 任务 ----
      let navTarget = null;
      if (bombPlanted && !bombDefused) {
        if (bot.team === 'CT') navTarget = bombPos;
        else navTarget = bombPos; // T方Bot也走向炸弹
      } else if (!bombPlanted && bot.team === 'T' && (bot.bomb || (bombPos && !player.bomb && !anyBotHasBomb('T')))) {
        navTarget = Math.abs(bot.x - NAV.A.x) < Math.abs(bot.x - NAV.B.x) ? NAV.A : NAV.B;
      } else if (!bombPlanted && bot.team === 'CT') {
        // CT巡逻：循A/B和出生点
        const pts = PATROLS_CT;
        const pt = pts[bot.patrolIdx % pts.length];
        navTarget = pt;
        if (Math.hypot(bot.x - pt.x, bot.z - pt.z) < 5) bot.patrolIdx++;
      } else {
        const pts = bot.team === 'T' ? PATROLS_T : PATROLS_CT;
        const pt = pts[bot.patrolIdx % pts.length];
        navTarget = pt;
        if (Math.hypot(bot.x - pt.x, bot.z - pt.z) < 5) bot.patrolIdx++;
      }
      if (navTarget) {
        bot.face = Math.atan2(navTarget.x - bot.x, navTarget.z - bot.z);
        bot.x += Math.sin(bot.face) * 2 * dt; bot.z += Math.cos(bot.face) * 2 * dt;
      }
    }

    // ---- C4 交互 ----
    if (bombPlanted && !bombDefused && bot.team === 'CT') {
      const d = Math.hypot(bot.x - bombPos.x, bot.z - bombPos.z);
      if (d < 3 && !defusing) { defusing = bot; bot.defuseT = DEFUSE_NORM; }
    }
    if (!bombPlanted && bot.team === 'T' && bot.bomb && !player.bomb) {
      const dA = Math.hypot(bot.x - NAV.A.x, bot.z - NAV.A.z), dB = Math.hypot(bot.x - NAV.B.x, bot.z - NAV.B.z);
      if ((dA < 4 || dB < 4) && !planting) { planting = bot; bot.plantT = 4; }
    }
    if (bot.defuseT > 0) { bot.defuseT -= dt; if (bot.defuseT <= 0) defuseBomb(); }
    if (bot.plantT > 0) { bot.plantT -= dt; if (bot.plantT <= 0) plantBomb(); }

    // ---- 碰撞处理 ----
    if (collides(bot.x, bot.z, BOT_R)) { bot.x -= Math.sin(bot.face) * dt * 3; bot.z -= Math.cos(bot.face) * dt * 3; }
    bot.y = 1.75;

    // ---- 脚步声 ----
    bot.moving = true; // Bot始终在移动
    bot.ground = true;
    bot.stepTimer += dt;
    const si = getStepInterval(bot);
    if (bot.stepTimer >= si) { bot.stepTimer = 0; playFootstep(bot); }
  }
}

/** 射线是否被墙壁/箱子遮挡 */
function rayBlocked(shooter, tx, tz) {
  const dx = tx - shooter.x, dz = tz - shooter.z, dist = Math.hypot(dx, dz);
  const h = rayCast(shooter.x, shooter.y + 0.3, shooter.z, dx / dist, 0, dz / dist, dist, null, 0);
  return h.world || false;
}

/** Bot 开火 */
function botShoot(bot, tx, ty, tz, dist) {
  const w = WEAPONS[bot.weapon];
  if (!bot.ammo[bot.weapon] || bot.ammo[bot.weapon] <= 0) return;
  bot.ammo[bot.weapon]--; bot.fireCd = w.fireRate;
  const spread = (Math.random() - 0.5) * (dist * 0.0006 + 0.015);
  const dx = Math.sin(bot.face + spread), dz = Math.cos(bot.face + spread);
  const hit = rayCast(bot.x, bot.y + 0.3, bot.z, dx, 0, dz, 100, null, 0);
  if (hit.player) { damagePlayer(Math.round(w.dmg * 0.65)); }
  else if (hit.bot && hit.bot.team !== bot.team) { damageBot(hit.bot, Math.round(w.dmg * 0.7)); hit.bot.lastAttacker = bot.name; }
  shotSnd(bot.weapon);
}

/** 寻找最近敌方实体(玩家或Bot) */
function findClosestEnemy(bot) {
  let best = null, bestD = Infinity;
  // 检查玩家
  if (!player.dead && player.team !== bot.team) {
    const d = Math.hypot(bot.x - player.x, bot.z - player.z);
    if (d < bestD) { bestD = d; best = player; }
  }
  // 检查其他Bot
  for (const b of bots) {
    if (b.dead || b === bot || b.team === bot.team) continue;
    const d = Math.hypot(bot.x - b.x, bot.z - b.z);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

/** 检查指定阵营是否有Bot持有炸弹 */
function anyBotHasBomb(team) {
  for (const b of bots) { if (!b.dead && b.team === team && b.bomb) return true; }
  return false;
}

function endRound() {
  state = 'end';
  let pw = 'bot';
  if (winner === 'T') pw = player.team === 'T' ? 'player' : 'bot';
  else if (winner === 'CT') pw = player.team === 'CT' ? 'player' : 'bot';
  else if (winner === 'elim') { const atd = (player.team === 'T' ? player.dead : true) && bots.filter(b => b.team === 'T').every(b => b.dead); pw = atd ? (player.team === 'CT' ? 'player' : 'bot') : (player.team === 'T' ? 'player' : 'bot'); }
  else if (winner === 'player') pw = 'player';

  if (pw === 'player') {
    if (player.team === 'T') scoreT++; else scoreCT++;
    player.money += WIN_R; player.losses = 0;
  } else {
    player.losses++;
    player.money += Math.min(LOSE_BASE + (player.losses - 1) * 500, 3400);
  }

  const el = document.getElementById('endoverlay');
  const t = document.getElementById('endtitle');
  const m = document.getElementById('endmsg');
  t.textContent = pw === 'player' ? '🎯 回合胜利！' : '💀 回合失败';
  t.className = 'winner ' + (pw === 'player' ? 'win' : 'lose');
  m.textContent = (winner === 'T' ? '💥 C4 已爆炸' : winner === 'CT' ? '🛡 C4 已拆除' : winner === 'elim' ? '⚔ 全部消灭' : '') + ' · T ' + scoreT + ':' + scoreCT + ' CT';
  document.getElementById('endstats').textContent = '击杀: ' + player.kills + ' | 死亡: ' + player.deaths + ' | $' + player.money;
  el.style.display = 'flex'; document.getElementById('bombhud').style.display = 'none';
  document.getElementById('endbtn').onclick = () => { el.style.display = 'none'; startBuy(); };
}

function checkEnd() {
  if (winner) return;
  const allTdead = (player.team === 'T' ? player.dead : true) && bots.filter(b => b.team === 'T').every(b => b.dead);
  const allCTdead = (player.team === 'CT' ? player.dead : true) && bots.filter(b => b.team === 'CT').every(b => b.dead);
  if (allTdead || allCTdead) { winner = 'elim'; endRound(); }
}

function updateBuyMenu() {
  document.querySelectorAll('#buymenu .row').forEach(r => {
    const item = r.dataset.item; if (!item) return;
    const w = WEAPONS[item];
    const dz = player.team === 'T' ? Math.hypot(player.x - NAV.Tspawn.x, player.z - NAV.Tspawn.z) : Math.hypot(player.x - NAV.CTspawn.x, player.z - NAV.CTspawn.z);
    if (dz > BUY_ZONE) { r.classList.add('locked'); return; }
    r.classList.remove('locked');
    if (item === 'armor') { r.classList.toggle('owned', player.armor > 0); }
    else if (item === 'defuser') { r.classList.toggle('owned', player.team !== 'CT' || player.defuser); }
    else if (item === 'hegrenade') { r.classList.toggle('owned', player.nades.he >= 3); }
    else if (item === 'flashbang') { r.classList.toggle('owned', player.nades.flash >= 3); }
    else if (item === 'smoke') { r.classList.toggle('owned', player.nades.smoke >= 2); }
    else { r.classList.toggle('owned', player.weapons.includes(item)); }
    if (player.money < w.cost || !canBuy) r.classList.add('locked');
  });
}

function buyItem(key) {
  if (state !== 'buy') return;
  const dz = player.team === 'T' ? Math.hypot(player.x - NAV.Tspawn.x, player.z - NAV.Tspawn.z) : Math.hypot(player.x - NAV.CTspawn.x, player.z - NAV.CTspawn.z);
  if (dz > BUY_ZONE) return;
  const items = ['rifle', 'sniper', 'smg', 'deagle', 'armor', 'defuser', 'hegrenade', 'flashbang', 'smoke'];
  const item = items[key - 1];
  if (!item) return; const w = WEAPONS[item]; if (!w || player.money < w.cost) return;

  if (item === 'armor') { if (player.armor > 0) return; player.armor = 100; player.money -= w.cost; snd(600, 0.1, 0.15); }
  else if (item === 'defuser') { if (player.team !== 'CT' || player.defuser) return; player.defuser = true; player.money -= w.cost; snd(600, 0.1, 0.15); }
  else if (item === 'hegrenade') { if (player.nades.he >= 3) return; player.nades.he++; player.money -= w.cost; snd(700, 0.1, 0.15); }
  else if (item === 'flashbang') { if (player.nades.flash >= 3) return; player.nades.flash++; player.money -= w.cost; snd(700, 0.1, 0.15); }
  else if (item === 'smoke') { if (player.nades.smoke >= 2) return; player.nades.smoke++; player.money -= w.cost; snd(700, 0.1, 0.15); }
  else {
    if (player.weapons.includes(item)) return;
    player.weapons.push(item);
    if (player.weapons.length > 3) player.weapons.shift();
    player.money -= w.cost;
    player.weapon = item;
    player.ammo[item] = w.mag;
    player.reserve = w.reserve;
    snd(800, 0.1, 0.15);
  }
  updateBuyMenu(); updateHUD();
  switchWeaponModel(item);
}

function toggleBuy() {
  if (state !== 'buy') return;
  const m = document.getElementById('buymenu');
  m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
  updateBuyMenu();
}

function drawMinimap() {
  const c = document.getElementById('minimap'), ctx = c.getContext('2d');
  const w = c.width, h = c.height, sx = w / MAP_W, sz = h / MAP_H;
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, w, h);
  // 墙壁
  ctx.fillStyle = 'rgba(100,90,70,0.6)';
  for (const wl of walls) ctx.fillRect((wl.x + MAP_W / 2) * sx, (wl.z + MAP_H / 2) * sz, wl.w * sx, wl.h * sz);
  ctx.fillStyle = 'rgba(130,120,100,0.4)';
  for (const tw of thinWalls) ctx.fillRect((tw.x + MAP_W / 2) * sx, (tw.z + MAP_H / 2) * sz, tw.w * sx, tw.h * sz);
  ctx.fillStyle = 'rgba(180,140,90,0.5)';
  for (const cr of crates) ctx.fillRect((cr.x + MAP_W / 2) * sx, (cr.z + MAP_H / 2) * sz, cr.w * sx, cr.h * sz);
  // 烟雾标记
  for (const sm of smokes) {
    if (sm.life <= 0) continue;
    ctx.fillStyle = 'rgba(180,180,180,' + (0.3 * sm.life / sm.maxLife) + ')';
    ctx.beginPath(); ctx.arc((sm.x + MAP_W / 2) * sx, (sm.z + MAP_H / 2) * sz, sm.maxRadius * sx, 0, Math.PI * 2); ctx.fill();
  }
  // 炸弹
  if (bombPlanted && bombPos) {
    ctx.fillStyle = '#ef4444'; ctx.beginPath();
    ctx.arc((bombPos.x + MAP_W / 2) * sx, (bombPos.z + MAP_H / 2) * sz, 4, 0, Math.PI * 2); ctx.fill();
  }
  // Bot
  for (const b of bots) {
    if (b.dead) continue;
    ctx.fillStyle = b.team === player.team ? '#4ade80' : '#ef4444';
    ctx.beginPath(); ctx.arc((b.x + MAP_W / 2) * sx, (b.z + MAP_H / 2) * sz, 3, 0, Math.PI * 2); ctx.fill();
  }
  // 玩家
  if (!player.dead) {
    ctx.fillStyle = '#fde047'; ctx.beginPath();
    ctx.arc((player.x + MAP_W / 2) * sx, (player.z + MAP_H / 2) * sz, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  }
}

const keys = {};
let mx = 0, my = 0, locked = false;

renderer.domElement.addEventListener('click', () => { if (AC && AC.state === 'suspended') AC.resume(); if (state !== 'end') renderer.domElement.requestPointerLock(); });
document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === renderer.domElement; });
document.addEventListener('mousemove', e => { if (locked) { mx += e.movementX; my += e.movementY; } });
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'b' && state === 'buy') toggleBuy();
  if (e.key.toLowerCase() === 'e') handleUse();
  if (e.key.toLowerCase() === 'tab') { e.preventDefault(); document.getElementById('scoreboard').style.display = 'flex'; updateScoreboard(); }
  const n = parseInt(e.key);
  if (n >= 1 && n <= 9 && document.getElementById('buymenu').style.display === 'flex') buyItem(n);
  if (e.key.toLowerCase() === 'g' && state === 'playing' && !player.dead) {
    if (player.nades.he > 0) throwNade('he');
    else if (player.nades.flash > 0) throwNade('flash');
    else if (player.nades.smoke > 0) throwNade('smoke');
  }
});
document.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (e.key.toLowerCase() === 'tab') document.getElementById('scoreboard').style.display = 'none';
});
document.addEventListener('wheel', e => {
  if (!locked) return;
  const idx = player.weapons.indexOf(player.weapon);
  if (e.deltaY > 0) { const nxt = (idx + 1) % player.weapons.length; switchWeapon(player.weapons[nxt]); }
  else { const prv = (idx - 1 + player.weapons.length) % player.weapons.length; switchWeapon(player.weapons[prv]); }
});

function switchWeapon(wid) {
  if (!player.weapons.includes(wid)) return;
  player.weapon = wid; player.recIdx = 0; player.spread = 0; player.reloadT = 0;
  player.wpnSwitch = 0.15; player.wpnSwitchTo = wid;
  switchWeaponModel(wid);
  updateHUD();
}

function switchWeaponModel(wid) {
  for (const k of Object.keys(wpnModels)) wpnModels[k].visible = false;
  curWpnModel = wpnModels[wid]; if (curWpnModel) curWpnModel.visible = true;
}

function handleUse() {
  if (player.dead) return;
  // CT拆除C4
  if (bombPlanted && player.team === 'CT' && !bombDefused) {
    const d = Math.hypot(player.x - bombPos.x, player.z - bombPos.z);
    if (d < 3 && !defusing) { defusing = player; player.defuseT = player.defuser ? DEFUSE_KIT : DEFUSE_NORM; }
  }
  // T捡起掉落的C4
  if (bombPos && !bombPlanted && player.team === 'T' && !player.bomb) {
    const d = Math.hypot(player.x - bombPos.x, player.z - bombPos.z);
    if (d < 2.5) { player.bomb = true; bombPos = null; snd(600, 0.15, 0.15); }
  }
  // T安放C4
  if (!bombPlanted && player.team === 'T' && player.bomb) {
    const dA = Math.hypot(player.x - NAV.A.x, player.z - NAV.A.z), dB = Math.hypot(player.x - NAV.B.x, player.z - NAV.B.z);
    if ((dA < 4.5 || dB < 4.5) && !planting) { planting = player; player.plantT = 3; }
  }
}

// 模块 23: 主游戏循环
// ==================================================================
let lastT = performance.now();

function update(dt) {
  if (state === 'end') return;
  if (state === 'buy') {
    buyTimer -= dt;
    if (buyTimer <= 0) startRound();
    updatePlayerMove(dt);
    updateHUD();
    return;
  }
  if (bombPlanted && !bombDefused) {
    bombTimer -= dt;
    if (bombTimer <= 0) { winner = 'T'; endRound(); return; }
    updateBombUI();
  }
  // 更新Bot 3D模型位置
  for (const b of bots) {
    const m = botMeshes.get(b);
    if (m && !b.dead) { m.position.set(b.x, 0, b.z); m.rotation.y = b.face; m.visible = true; }
    else if (m && b.dead) { m.visible = false; }
  }
  // 更新C4炸弹模型
  if (bombPlanted && bombModel && bombPos) {
    bombModel.position.set(bombPos.x, 0.25, bombPos.z); bombModel.visible = true;
    const lgt = bombModel.getObjectByName('bombLight');
    if (lgt) lgt.material.color.setHex(Math.sin(Date.now() * 0.02) > 0 ? 0xff0000 : 0x440000);
  }
  if (!player.dead) updatePlayer(dt);
  updateBots(dt);
  updateGrenades(dt);
  updateSmokes(dt);  // 烟雾粒子更新
  updateHitSparks(dt);  // 命中火花
  updateBulletHoles(dt);  // 弹孔衰减
  if (shakeMag > 0) shakeMag = Math.max(0, shakeMag - dt * 12);  // 震屏衰减
  updateHUD();
  checkEnd();
  drawMinimap();
  updateVignette();
}

function updatePlayer(dt) {
  updatePlayerMove(dt);
  // 死亡倒地动画
  if (player.dead) {
    player.deathTilt += dt * 2.5;
    player.deathFall += dt * 1.8;
    const tilt = Math.min(player.deathTilt, Math.PI / 2);
    const fallY = Math.max(0, player.y - player.deathFall);
    camera.position.set(player.x, fallY + 0.35, player.z);
    camera.rotation.set(-tilt, player.face - Math.PI, 0, 'YXZ');
    return;
  }
  if (player.hp <= 0) { player.dead = true; return; }
  if (player.flashBlind > 0) player.flashBlind -= dt;
  if (player.reloadT > 0) { player.reloadT -= dt; if (player.reloadT <= 0) reloadFinish(); return; }
  if (player.plantT > 0) { player.plantT -= dt; if (player.plantT <= 0) plantBomb(); return; }
  if (player.defuseT > 0) { player.defuseT -= dt; if (player.defuseT <= 0) defuseBomb(); return; }
  if (player.wpnSwitch > 0) player.wpnSwitch -= dt;

  // 视角
  player.face -= mx * 0.0022;
  player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch - my * 0.0022));
  mx = 0; my = 0;
  player.fireCd -= dt;

  // 射击
  if (keys['f'] && player.fireCd <= 0 && player.reloadT <= 0 && !player.plantT && !player.defuseT && player.wpnSwitch <= 0) {
    if (player.weapon === 'knife') fireWeapon(player, false);
    else if ((player.ammo[player.weapon] || 0) > 0) fireWeapon(player, false);
  }
  // 换弹
  if (keys['r'] && player.reloadT <= 0 && player.weapon !== 'knife') {
    const w = WEAPONS[player.weapon];
    if ((player.ammo[player.weapon] || 0) < w.mag && player.reserve > 0) reloadStart();
  }
  // 武器切换
  if (keys['1'] && player.weapons[0]) switchWeapon(player.weapons[0]);
  if (keys['2'] && player.weapons[1]) switchWeapon(player.weapons[1]);
  if (keys['3'] && player.weapons[2]) switchWeapon(player.weapons[2]);
  player.aim = keys['q'] && player.weapon === 'sniper';

  // 武器动画
  updateWpnAnim(dt);

  // 摄像机
  const eyeH = player.crouch ? 0.9 : 1.75;
  camera.position.set(player.x, player.y + eyeH - 0.05, player.z);
  camera.lookAt(player.x + Math.sin(player.face) * 10, player.y + eyeH + Math.tan(player.pitch) * 10, player.z + Math.cos(player.face) * 10);
}

function updatePlayerMove(dt) {
  let spd = 5, mx_ = 0, mz_ = 0;
  if (player.crouch) spd = 2.2;
  if (player.walk) spd *= 0.45;
  if (!player.ground) spd *= 0.7;
  if (state === 'buy') spd *= 1.2;

  if (keys['w']) { mx_ -= Math.sin(player.face) * spd; mz_ -= Math.cos(player.face) * spd; }
  if (keys['s']) { mx_ += Math.sin(player.face) * spd; mz_ += Math.cos(player.face) * spd; }
  if (keys['a']) { mx_ -= Math.cos(player.face) * spd; mz_ += Math.sin(player.face) * spd; }
  if (keys['d']) { mx_ += Math.cos(player.face) * spd; mz_ -= Math.sin(player.face) * spd; }
  player.moving = Math.abs(mx_) + Math.abs(mz_) > 0.1;
  player.crouch = keys['control'] || keys['ctrl'];
  player.walk = keys['shift'];

  // 跳跃
  if (keys[' '] && player.ground) { player.yS = 5.5; player.ground = false; snd(200, 0.05, 0.05); }

  // 重力
  player.yS -= GRAVITY * dt;
  let nx = player.x + mx_ * dt, nz = player.z + mz_ * dt, ny = player.y + player.yS * dt;
  if (!collides(nx, player.z, PLAYER_R)) player.x = nx;
  if (!collides(player.x, nz, PLAYER_R)) player.z = nz;

  // 落地检测
  const wasGround = player.ground;
  player.y = ny;
  if (player.y <= 0.08) { player.y = 0.08; player.yS = 0; player.ground = true; }
  if (player.y > 1.75) player.ground = false;
  if (!wasGround && player.ground) playLand(player);  // 落地声

  // 购买区域判断
  if (state === 'buy') {
    const dz = player.team === 'T' ? Math.hypot(player.x - NAV.Tspawn.x, player.z - NAV.Tspawn.z) : Math.hypot(player.x - NAV.CTspawn.x, player.z - NAV.CTspawn.z);
    canBuy = dz <= BUY_ZONE;
  }

  // ---- 脚步声 ----
  player.stepTimer += dt;
  const si = getStepInterval(player);
  if (player.stepTimer >= si) { player.stepTimer = 0; playFootstep(player); }
}

function updateWpnAnim(dt) {
  // Idle摆动
  player.wpnIdle += dt * (player.moving ? 6 : 1.5);
  const idleX = Math.sin(player.wpnIdle * 1.3) * 0.003 + Math.sin(player.wpnIdle * 2.7) * 0.002;
  const idleY = Math.cos(player.wpnIdle * 1.7) * 0.004 + Math.cos(player.wpnIdle * 3.1) * 0.002;

  // 跑步晃动
  let runX = 0, runY = 0;
  if (player.moving) {
    player.wpnBob += dt * (player.crouch ? 4 : 8);
    runX = Math.sin(player.wpnBob) * 0.016 * (player.crouch ? 0.5 : 1);
    runY = Math.abs(Math.cos(player.wpnBob)) * 0.01 * (player.crouch ? 0.5 : 1);
  }

  // 后坐力
  if (player.wpnKick > 0) player.wpnKick -= (player.wpnKick + 0.01) * dt * 20;
  const kz = -player.wpnKick * 0.3, kx = player.wpnKick * 0.08;

  // 切枪动画（从右下角甩上来）
  let swX = 0, swY = 0, swZ = 0;
  if (player.wpnSwitch > 0) {
    const t = 1 - Math.min(1, player.wpnSwitch / 0.15);
    swX = (1 - t) * 0.2;
    swY = -(1 - t) * 0.25;
    swZ = (1 - t) * 0.15;
  }

  // 换弹动画
  let relZ = 0, relTilt = 0;
  if (player.reloadT > 0 && player.weapon !== 'knife') {
    const w = WEAPONS[player.weapon];
    const phase = 1 - player.reloadT / w.reloadT;
    if (phase < 0.3) { relZ = -phase / 0.3 * 0.12; relTilt = -phase / 0.3 * 0.3; }
    else if (phase < 0.6) { relZ = -0.12; relTilt = -0.3; }
    else { relZ = -0.12 + (phase - 0.6) / 0.4 * 0.12; relTilt = -0.3 + (phase - 0.6) / 0.4 * 0.3; }
  }

  // 枪口火焰衰减
  if (muzzleFlashLife > 0) {
    muzzleFlashLife -= dt;
    if (muzzleFlashLife <= 0) { muzzleGlowMat.opacity = 0; }
    else muzzleGlowMat.opacity = Math.max(0, muzzleFlashLife / 0.08 * 0.9);
  }

  // 组合动画
  if (curWpnModel) {
    curWpnModel.position.set(0.12 + idleX + runX + kx + swX, -0.08 + idleY + runY + swY, -0.25 + kz + relZ + swZ);
    curWpnModel.rotation.set(relTilt, 0, player.wpnKick * 0.8);
  }
}

function updateVignette() {
  const v = document.getElementById('vignette');
  let r = 0;
  if (player.hp < 30) r = 0.4; else if (player.hp < 50) r = 0.15;
  if (player.flashBlind > 0) r = Math.max(r, player.flashBlind * 0.35);
  v.style.background = 'radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,' + r + ') 100%)';
}

// ==================================================================
// 渲染 (主场景 + 武器视图叠加)
// ==================================================================
function render() {
  // 屏幕震屏
  if (shakeMag > 0.01) {
    const sx = (Math.random() - 0.5) * shakeMag * 0.06;
    const sy = (Math.random() - 0.5) * shakeMag * 0.04;
    camera.position.x += sx; camera.position.y += sy;
  }
  renderer.autoClear = true; renderer.render(scene, camera);
  renderer.autoClear = false; renderer.render(wpnScene, wpnCam); renderer.autoClear = true;
}

function gameLoop(now) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  update(dt); render();
}

// ==================================================================
// 启动
// ==================================================================
buildMap(); resetBots(); startBuy();
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
gameLoop(performance.now());
console.log('⚔ 战术突袭 v3 · 3v3 · 烟雾弹 · 脚步声 · WASD移动 鼠标瞄准 F射击 R换弹 E交互 B购买 G投掷 Tab计分板');
</script>
</body>
